# Local dev services. Start with: docker compose up -d
# Postgres is the app's source of truth (mirrors Cloud SQL in prod).
services:
  postgres:
    image: postgres:18-alpine
    container_name: showme-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: showme
    ports:
      - "5432:5432"
    volumes:
      - showme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d showme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  showme-pgdata:
