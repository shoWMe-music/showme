  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"Inter Tight\", \"Inter\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n  --font-mono: \"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace;\n\n  /* Layout */\n  --radius-sm: 8px;\n  --radius-md: 14px;\n  --radius-lg: 24px;\n  --radius-xl: 40px;\n  --container: 1320px;\n  --ease-out: cubic-bezier(.2,.8,.2,1); /* @kind other */\n  --ease-inout: cubic-bezier(.7,0,.3,1); /* @kind other */\n}\n\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nhtml, body {\n  margin: 0; padding: 0;\n  background: var(--ink-1000);\n  color: var(--ink-100);\n  font-family: var(--font-sans);\n  font-size: 17px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n}\n\na { color: inherit; text-decoration: none; }\nbutton { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }\nimg { display: block; max-width: 100%; }\n\n.container {\n  width: min(100% - 48px, var(--container));\n  margin-inline: auto;\n}\n\n/* ---------- Type ---------- */\n.display {\n  font-family: var(--font-display);\n  font-weight: 500;\n  letter-spacing: -0.03em;\n  line-height: 0.95;\n}\n.eyebrow {\n  font-family: var(--font-mono);\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--brand-gold);\n  font-weight: 500;\n}\n.body-lg {\n  font-size: 19px;\n  line-height: 1.5;\n  color: var(--ink-200);\n  max-width: 58ch;\n}\n\n/* ---------- Noise overlay ---------- */\nbody::before {\n  content: \"\";\n  position: fixed; inset: 0;\n  pointer-events: none;\n  z-index: 1;\n  opacity: .045;\n  mix-blend-mode: overlay;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><\u002Ffilter><rect width='100%' height='100%' filter='url(%23n)'/><\u002Fsvg>\");\n}\n\n/* ---------- Nav ---------- */\n.nav {\n  position: fixed; top: 0; left: 0; right: 0;\n  z-index: 100;\n  padding: 20px 0;\n  transition: background .3s, backdrop-filter .3s, padding .3s;\n}\n.nav.scrolled {\n  background: rgba(10,6,4,.72);\n  backdrop-filter: blur(18px) saturate(1.4);\n  -webkit-backdrop-filter: blur(18px) saturate(1.4);\n  padding: 14px 0;\n  border-bottom: 1px solid rgba(255,233,184,.06);\n}\n.nav__row {\n  display: flex; align-items: center; justify-content: space-between;\n  gap: 32px;\n}\n.brand {\n  display: flex; align-items: center; gap: 10px;\n  font-family: var(--font-display);\n  font-weight: 600;\n  font-size: 22px;\n  letter-spacing: -0.01em;\n}\n.brand__mark {\n  width: 34px; height: 34px;\n  display: grid; place-items: center;\n}\n.brand__mark svg { width: 100%; height: 100%; }\n.nav__links {\n  display: flex; gap: 34px;\n  color: var(--ink-200);\n  font-size: 14.5px;\n  font-weight: 450;\n}\n.nav__links a {\n  transition: color .2s;\n  position: relative;\n}\n.nav__links a:hover { color: var(--brand-gold); }\n.nav__cta {\n  display: flex; gap: 12px; align-items: center;\n}\n\n/* ---------- Buttons ---------- */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 13px 22px;\n  border-radius: 999px;\n  font-size: 14.5px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  transition: transform .2s var(--ease-out), background .2s, box-shadow .2s, color .2s;\n  white-space: nowrap;\n}\n.btn--ghost { color: var(--ink-100); }\n.btn--ghost:hover { color: var(--brand-gold); }\n.btn--outline {\n  border: 1px solid rgba(255,233,184,.22);\n  color: var(--ink-100);\n}\n.btn--outline:hover {\n  border-color: var(--brand-gold);\n  color: var(--brand-gold);\n}\n.btn--primary {\n  background: linear-gradient(135deg, var(--brand-red) 0%, var(--brand-amber) 100%);\n  color: #120903;\n  font-weight: 600;\n  box-shadow: 0 8px 28px -10px rgba(238,87,70,.6), inset 0 1px 0 rgba(255,255,255,.3);\n}\n.btn--primary:hover {\n  transform: translateY(-1px);\n  box-shadow: 0 14px 38px -10px rgba(238,87,70,.8), inset 0 1px 0 rgba(255,255,255,.4);\n}\n.btn--lg { padding: 17px 28px; font-size: 15.5px; }\n.btn__arrow { transition: transform .25s var(--ease-out); }\n.btn:hover .btn__arrow { transform: translateX(3px); }\n\n/* ---------- Hero ---------- */\n.hero {\n  position: relative;\n  min-height: 100vh;\n  padding: 140px 0 80px;\n  overflow: hidden;\n  isolation: isolate;\n}\n.hero__bg {\n  position: absolute; inset: 0;\n  z-index: -1;\n}\n#hero-canvas {\n  position: absolute;\n  inset: 0;\n  width: 100%; height: 100%;\n  z-index: -1;\n}\n.hero__glow {\n  position: absolute; inset: 0;\n  background: var(--stage-glow);\n  pointer-events: none;\n  z-index: -1;\n}\n.hero__grid {\n  position: absolute; inset: 0;\n  background-image:\n    linear-gradient(rgba(255,233,184,.04) 1px, transparent 1px),\n    linear-gradient(90deg, rgba(255,233,184,.04) 1px, transparent 1px);\n  background-size: 64px 64px;\n  mask-image: radial-gradient(ellipse at 50% 40%, black 0%, transparent 70%);\n  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, black 0%, transparent 70%);\n  z-index: -1;\n  pointer-events: none;\n}\n\n.hero__inner {\n  position: relative;\n  display: grid;\n  grid-template-columns: 1.05fr 1fr;\n  gap: 60px;\n  align-items: center;\n  min-height: 76vh;\n}\n.hero__copy { position: relative; z-index: 2; }\n.hero__badge {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 7px 14px 7px 7px;\n  background: rgba(255,233,184,.06);\n  border: 1px solid rgba(255,233,184,.14);\n  border-radius: 999px;\n  font-size: 13px;\n  color: var(--ink-200);\n  margin-bottom: 28px;\n}\n.hero__badge-pulse {\n  width: 20px; height: 20px;\n  border-radius: 50%;\n  background: var(--brand-red);\n  position: relative;\n  display: grid; place-items: center;\n}\n.hero__badge-pulse::before {\n  content: \"\";\n  position: absolute; inset: 0;\n  border-radius: 50%;\n  background: var(--brand-red);\n  animation: pulse 2s infinite;\n}\n.hero__badge-pulse::after {\n  content: \"\";\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--brand-cream);\n  position: relative;\n  z-index: 1;\n}\n@keyframes pulse {\n  0% { transform: scale(1); opacity: .7; }\n  80%, 100% { transform: scale(2.4); opacity: 0; }\n}\n\n.hero__title {\n  font-size: clamp(52px, 7vw, 104px);\n  margin: 0 0 24px;\n}\n.hero__title .line {\n  display: block;\n  overflow: visible;\n  padding: 0.04em 0.32em 0.14em 0;\n}\n.hero__title .word {\n  display: inline-block;\n  opacity: 1;\n}\n@media (prefers-reduced-motion: no-preference) {\n  .hero__title .word {\n    opacity: 0;\n    transform: translateY(40%);\n    animation: riseIn .8s var(--ease-out) forwards;\n  }\n}\n.hero__title .word:nth-child(2) { animation-delay: .08s; }\n.hero__title .word:nth-child(3) { animation-delay: .16s; }\n.hero__title .line:nth-child(2) .word { animation-delay: .24s; }\n.hero__title .line:nth-child(2) .word:nth-child(2) { animation-delay: .32s; }\n.hero__title .line:nth-child(2) .word:nth-child(3) { animation-delay: .40s; }\n.hero__title .emph {\n  font-style: italic;\n  font-family: \"Instrument Serif\", serif;\n  font-weight: 400;\n  background: linear-gradient(110deg, var(--brand-gold) 0%, var(--brand-red-glow) 50%, var(--brand-gold) 100%);\n  background-size: 200% 100%;\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  animation: shimmer 6s linear infinite;\n  opacity: 1;\n}\n@media (prefers-reduced-motion: no-preference) {\n  .hero__title .emph {\n    opacity: 0;\n    animation: riseIn .8s var(--ease-out) .4s forwards, shimmer 6s linear infinite 1.2s;\n  }\n}\n@keyframes shimmer {\n  to { background-position: 200% 0; }\n}\n@keyframes riseIn {\n  to { transform: translateY(0); opacity: 1; }\n}\n\n.hero__sub {\n  font-size: clamp(17px, 1.3vw, 20px);\n  color: var(--ink-200);\n  max-width: 52ch;\n  margin: 0 0 40px;\n  opacity: 0;\n  animation: fadeUp .7s var(--ease-out) .55s forwards;\n}\n@keyfram kground: var(--brand-red);\n}\n@keyframes marquee {\n  to { transform: translateX(-50%); }\n}\n\n/* ---------- Section base ---------- */\nsection { position: relative; }\n.section {\n  padding: 140px 0;\n  position: relative;\n}\n.section__head {\n  max-width: 820px;\n  margin-bottom: 80px;\n}\n.section__eyebrow {\n  display: inline-flex; align-items: center; gap: 10px;\n  margin-bottom: 20px;\n}\n.section__eyebrow::before {\n  content: \"\";\n  width: 28px; height: 1px;\n  background: var(--brand-gold);\n}\n.section__title {\n  font-family: var(--font-display);\n  font-size: clamp(40px, 5vw, 68px);\n  padding-bottom: 0.12em;\n  line-height: 1.02;\n  letter-spacing: -0.03em;\n  margin: 0 0 24px;\n  font-weight: 500;\n}\n.section__title .emph {\n  font-family: \"Instrument Serif\", serif;\n  font-style: italic;\n  padding-right: 0.12em;\n  font-weight: 400;\n  background: linear-gradient(120deg, var(--brand-gold), var(--brand-red-glow));\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n}\n.section__sub {\n  font-size: 19px;\n  color: var(--ink-300);\n  max-width: 60ch;\n}\n\n/* ---------- Problem (Chaos → Order) ---------- */\n.chaos {\n  background: linear-gradient(180deg, var(--ink-1000) 0%, var(--ink-900) 100%);\n  overflow: hidden;\n}\n.chaos__stage {\n  position: relative;\n  height: 520px;\n  margin-top: 40px;\n  border-radius: var(--radius-lg);\n  background: radial-gradient(ellipse at 50% 50%, rgba(238,87,70,.08) 0%, transparent 70%);\n  border: 1px solid rgba(255,233,184,.06);\n  overflow: hidden;\n}\n.chaos__toggle {\n  position: absolute;\n  top: 24px; left: 50%;\n  transform: translateX(-50%);\n  display: flex;\n  background: rgba(10,6,4,.6);\n  backdrop-filter: blur(12px);\n  border: 1px solid rgba(255,233,184,.12);\n  border-radius: 999px;\n  padding: 4px;\n  z-index: 10;\n}\n.chaos__toggle button {\n  padding: 8px 20px;\n  border-radius: 999px;\n  font-size: 13px;\n  color: var(--ink-300);\n  font-weight: 500;\n  tra  { padding: 12px 10px; }\n}\n@media (max-width: 600px) {\n  .stats { grid-template-columns: 1fr; }\n  .footer__grid { grid-template-columns: 1fr; }\n  .hero { padding-top: 120px; }\n  .section { padding: 80px 0; }\n}\n\n/* ---------- Layering: keep all real UI above the grain overlay ---------- */\n.nav, .hero, .marquee, .section, .cta, .footer { position: relative; z-index: 2; }\n.nav { z-index: 100; }\n.hero__stage { z-index: 2; }\n.hero__copy { z-index: 3; }\n\n/* ---------- Mobile polish ---------- */\n@media (max-width: 760px) {\n  /* Nav: drop the ghost \"Sign in\" so the primary CTA never crowds the logo */\n  .nav__cta .btn--ghost { display: none; }\n  .nav { padding: 14px 0; }\n  .nav__row { gap: 14px; }\n  .brand { font-size: 19px; }\n  .brand__mark { width: 28px; height: 28px; }\n  .nav__cta .btn { padding: 10px 16px; font-size: 13.5px; }\n\n  /* Hero: long intro copy stays readable, actions don't overflow */\n  .hero__inner { gap: 36px; }\n  .hero__sub { max-width: 100%; font-size: 16px; }\n  .hero__actions .btn { width: 100%; justify-content: center; }\n\n  /* Chaos \"With shoWMe\" panel gets room so nothing clips */\n  .chaos__stage { height: auto; min-height: 660px; }\n  .chaos__note { min-width: 140px; font-size: 12px; padding: 10px 12px; }\n\n  /* Ecosystem galaxy needs a touch less height on small screens */\n  .ecosystem__orbit { height: 460px; }\n\n  .cta { padding: 90px 0 100px; }\n  .cta__actions .btn { width: 100%; justify-content: center; }\n  .footer__bottom { flex-direction: column; gap: 8px; }\n}\n<\u002Fstyle>\n<style>\n  /* Dark surfaces — matches landing page */\n  :root{ --sec-bg:var(--ink-1000); --hair:rgba(255,233,184,.08); --hair-hi:rgba(255,194,102,.28); --ink-strong:var(--ink-100); --ink-soft:var(--ink-300); --ease:var(--ease-out); }\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  body{background:var(--sec-bg);font-family:var(--font-sans);color:var(--ink-strong);-webkit-font-smoothing:antialiased}\n\n  .why{max-width:1100px;margin:0 auto;padding:64px 40px;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;position:relative;z-index:2}\n  .why__copy .section__title{margin:0 0 22px}\n  .why__copy p{font-size:17px;line-height:1.6;color:var(--ink-soft);margin:0 0 18px;max-width:30ch}\n  .why__copy .kicker{font-weight:600;color:var(--ink-strong)}\n\n  /* ---------- Animated panel ---------- */\n  .stage{position:relative;background:linear-gradient(180deg,var(--ink-900),var(--ink-950));border:1px solid var(--hair);border-radius:var(--radius-lg);aspect-ratio:1.05/1;overflow:hidden}\n  .stage__glow{position:absolute;left:50%;top:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(238,87,70,.24) 0%,rgba(255,194,102,.08) 42%,transparent 70%);opacity:0;animation:glowin 1.2s var(--ease) .4s forwards}\n  @keyframes glowin{to{opacity:1}}\n  .rings{position:absolute;inset:0;width:100%;height:100%}\n  .ring{fill:none;stroke:rgba(255,233,184,.09);stroke-width:1}\n  .ring--dash{stroke:rgba(255,194,102,.18);stroke-dasharray:3 9;transform-origin:200px 190px;animation:spin 34s linear infinite}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  .wires{position:absolute;inset:0;width:100%;height:100%}\n  .wire{stroke:var(--brand-red);stroke-width:1.5;stroke-dasharray:5 6;fill:none;opacity:.5;\n        stroke-dashoffset:220;animation:draw 900ms var(--ease) forwards}\n  .wire.w1{animation-delay:.35s}.wire.w2{animation-delay:.48s}.wire.w3{animation-delay:.61s}.wire.w4{animation-delay:.74s}\n  @keyframes draw{to{stroke-dashoffset:0}}\n  .pulse{fill:var(--brand-gold);opacity:0}\n  .pulse.on{opacity:1}\n\n  .node{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);\n        width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;\n        background:radial-gradient(circle at 38% 32%,var(--brand-red-glow),var(--brand-red) 46%,var(--brand-red-deep));\n        color:var(--brand-cream);font-family:var(--font-display);font-weight:600;font-size:clamp(15px,1.9vw,20px);\n        box-shadow:0 14px 40px rgba(238,87,70,.45);\n        animation:pop .7s var(--ease) .05s forwards,breathe 3.6s ease-in-out 1.1s infinite}\n  .node::after{content:\"\";position:absolute;inset:-14%;border-radius:50%;border:1.5px solid rgba(255,194,102,.55);\n        opacity:0;animation:ring 3.6s ease-out 1.4s infinite}\n  @keyframes pop{0%{transform:translate(-50%,-50%) scale(0)}60%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}\n  @keyframes breathe{0%,100%{box-shadow:0 14px 40px rgba(238,87,70,.42)}50%{box-shadow:0 18px 56px rgba(238,87,70,.68)}}\n  @keyframes ring{0%{transform:scale(.85);opacity:.6}70%{opacity:0}100%{transform:scale(1.5);opacity:0}}\n\n  .chip{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;display:flex;align-items:center;gap:9px;\n        background:linear-gradient(180deg,var(--ink-800),var(--ink-950));color:var(--ink-100);font-weight:500;font-size:clamp(12px,1.35vw,14px);line-height:1.2;\n        padding:11px 17px;border-radius:var(--radius-md);white-space:nowrap;\n        border:1px solid var(--hair);box-shadow:0 10px 26px rgba(0,0,0,.4);\n        animation:chipin .55s var(--ease) forwards}\n  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--brand-gold);box-shadow:0 0 9px rgba(255,194,102,.9);flex:none}\n  .chip.c1{left:26%;top:20%;animation-delay:.9s}\n  .chip.c2{left:74%;top:20%;animation-delay:1.0s}\n  .chip.c3{left:26%;top:80%;animation-delay:1.1s}\n  .chip.c4{left:74%;top:80%;animation-delay:1.2s}\n  @keyframes chipin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}60%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}\n\n  @media(max-width:760px){.why{grid-template-columns:1fr;gap:32px}.why__copy p{max-width:none}}\n  @media(prefers-reduced-motion:reduce){\n    .wire,.node,.node::after,.chip{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none}\n    .node{transform:translate(-50%,-50%) scale(1)}\n    .chip.c1{transform:translate(-50%,-50%)}.chip.c2{transform:translate(-50%,-50%)}.chip.c3{transform:translate(-50%,-50%)}.chip.c4{transform:translate(-50%,-50%)}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n  <section class=\"why\">\n    <div class=\"why__copy\">\n      <span class=\"eyebrow section__eyebrow\">Why shoWMe<\u002Fspan>\n      <h2 class=\"section__title\">Make the event<br>the <span class=\"emph\">center<\u002Fspan><\u002Fh2>\n      <p>shoWMe turns every event into a shared workspace where all parties operate on the same information in real time.<\u002Fp>\n      <p class=\"kicker\">One system. <span style=\"color:var(--brand-gold);font-weight:600\">One event.<\u002Fspan> All parties.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"stage\" aria-label=\"Team, Venue, Promoter and Performer connected to a central Event\">\n      <div class=\"stage__glow\"><\u002Fdiv>\n      <svg class=\"rings\" viewBox=\"0 0 400 380\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <circle class=\"ring\" cx=\"200\" cy=\"190\" r=\"78\"><\u002Fcircle>\n        <circle class=\"ring\" cx=\"200\" cy=\"190\" r=\"122\"><\u002Fcircle>\n        <circle class=\"ring ring--dash\" cx=\"200\" cy=\"190\" r=\"160\"><\u002Fcircle>\n      <\u002Fsvg>\n      <svg class=\"wires\" viewBox=\"0 0 400 380\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n        <!-- lines from center (200,190) to each chip -->\n        <line class=\"wire w1\" x1=\"200\" y1=\"190\" x2=\"104\" y2=\"76\"><\u002Fline>\n        <line class=\"wire w2\" x1=\"200\" y1=\"190\" x2=\"296\" y2=\"76\"><\u002Fline>\n        <line class=\"wire w3\" x1=\"200\" y1=\"190\" x2=\"104\" y2=\"304\"><\u002Fline>\n        <line class=\"wire w4\" x1=\"200\" y1=\"190\" x2=\"296\" y2=\"304\"><\u002Fline>\n        <circle class=\"pulse p1\" r=\"3.4\"><\u002Fcircle>\n        <circle class=\"pulse p2\" r=\"3.4\"><\u002Fcircle>\n        <circle class=\"pulse p3\" r=\"3.4\"><\u002Fcircle>\n        <circle class=\"pulse p4\" r=\"3.4\"><\u002Fcircle>\n      <\u002Fsvg>\n\n      <div class=\"node\">Event<\u002Fdiv>\n      <div class=\"chip c1\"><span class=\"dot\"><\u002Fspan>Venue<\u002Fdiv>\n      <div class=\"chip c2\"><span class=\"dot\"><\u002Fspan>Promoter<\u002Fdiv>\n      <div class=\"chip c3\"><span class=\"dot\"><\u002Fspan>Performer&nbsp;/&nbsp;Agent<\u002Fdiv>\n      <div class=\"chip c4\"><span class=\"dot\"><\u002Fspan>Team&nbsp;/&nbsp;Crew<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<script>\n(function(){\n  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n  var C={x:200,y:190};\n  var ends=[{x:104,y:76},{x:296,y:76},{x:104,y:304},{x:296,y:304}];\n  var dots=[].slice.call(document.querySelectorAll('.pulse'));\n  // send a pulse from event -> role, then role -> event, endlessly & staggered\n  function travel(dot,end,outward,cb){\n    var from = outward?C:end, to = outward?end:C;\n    var t0=null, dur=680;\n    dot.classList.add('on');\n    function step(ts){\n      if(t0===null)t0=ts;\n      var k=Math.min((ts-t0)/dur,1);\n      var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; // easeInOut\n      dot.setAttribute('cx',from.x+(to.x-from.x)*e);\n      dot.setAttribute('cy',from.y+(to.y-from.y)*e);\n      if(k<1)requestAnimationFrame(step);\n      else{dot.classList.remove('on');cb&&cb();}\n    }\n    requestAnimationFrame(step);\n  }\n  function loop(i){\n    var dot=dots[i],end=ends[i];\n    travel(dot,end,true,function(){          // event -> role\n      setTimeout(function(){\n        travel(dot,end,false,function(){      // role -> event\n          setTimeout(function(){loop(i);},900+Math.random()*700);\n        });\n      },260);\n    });\n  }\n  setTimeout(function(){ends.forEach(function(_,i){setTimeout(function(){loop(i);},i*380);});},1500);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
