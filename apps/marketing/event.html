<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event · shoWMe</title>
  <meta name="description" content="A live event announced on shoWMe.">
  <!-- Deliberately INDEXABLE, unlike the shared availability page. Publishing an
       event is the host's explicit decision to put a page about the show on the
       public internet, so hiding it from search would undo what they asked for.
       Nothing here exists until a host publishes it, and the page shows only the
       poster facts the API's public projection returns. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/event.css">
</head>
<body>
  <header class="page-header">
    <a href="index.html" class="brand" aria-label="shoWMe home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M8 48 A42 42 0 0 1 92 48 L92 92 L8 92 Z" fill="#EE5746"></path>
          <path d="M50 14 L82 76 L18 76 Z" fill="#FFE1A0"></path>
          <circle cx="50" cy="76" r="6" fill="#EE5746"></circle>
          <circle cx="34" cy="76" r="5" fill="#EE5746"></circle>
          <circle cx="66" cy="76" r="5" fill="#EE5746"></circle>
          <circle cx="22" cy="76" r="4" fill="#EE5746"></circle>
          <circle cx="78" cy="76" r="4" fill="#EE5746"></circle>
        </svg>
      </span>
      <span>shoWMe</span>
    </a>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
      Light mode
    </button>
  </header>

  <main class="event" id="event" aria-live="polite">
    <!-- Rendered by src/event.ts from GET /public/events/:id. There is no
         server-rendered markup because there is nothing to render until the API
         says the event is both published and confirmed — an unpublished event
         must not even leave a shell behind. -->
    <p class="event__loading">Loading the show…</p>
  </main>

  <footer class="page-footer">
    <p>Booking and settlement for live events. <a href="index.html">shoWMe</a></p>
    <p><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></p>
  </footer>

<script type="module" src="/src/event.ts"></script>
</body></html>
