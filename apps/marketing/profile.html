<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · shoWMe</title>
  <meta name="description" content="A public profile on shoWMe.">
  <!-- Indexable, unlike the shared-availability page. This one is a venue's or
       performer's own public page, published deliberately by its owner
       (`profiles.is_public`), and being findable is the point of it. The title
       and description are rewritten from the API response once it lands. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/profile.css">
</head>
<body>
  <!-- The whole page is painted by src/profile.ts from
       `GET /public/profiles/:slug`. Nothing is server-rendered here because this
       bundle has no session and no authenticated client — see the module
       docstring. The shell below is only what can be true before the fetch:
       the brand, and a line saying we are fetching.

       The top bar sits INSIDE the hero on screen (the hero's picture runs up
       behind it), which is a CSS overlap rather than a DOM one — so it can be
       static markup here and still look like part of the hero. -->
  <header class="topbar">
    <a href="index.html" class="brand" aria-label="shoWMe home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M8 48 A42 42 0 0 1 92 48 L92 92 L8 92 Z" fill="#EE5746"></path>
          <path d="M50 14 L82 76 L18 76 Z" fill="#FFE1A0"></path>
          <circle cx="50" cy="76" r="6" fill="#EE5746"></circle>
          <circle cx="34" cy="76" r="5" fill="#EE5746"></circle>
          <circle cx="66" cy="76" r="5" fill="#EE5746"></circle>
          <circle cx="22" cy="76" r="4" fill="#EE5746"></circle>
          <circle cx="78" cy="76" r="4" fill="#EE5746"></circle>
        </svg>
      </span>
      <span>shoWMe</span>
    </a>
    <!-- Section links are PREPENDED here by profile.ts, one per section that
         actually rendered: a "Listen" tab on a page with no music is a promise
         the page cannot keep. The theme toggle is markup because it works
         whatever the fetch does — including on the "profile not found" state. -->
    <nav class="topnav" id="section-nav" aria-label="Sections">
      <button type="button" class="topnav__link topnav__theme" id="theme-toggle" aria-pressed="false">
        Light mode
      </button>
    </nav>
  </header>

  <main class="profile" id="profile" aria-live="polite">
    <p class="profile__loading">Loading profile…</p>
  </main>

  <footer class="pagefoot" id="page-footer">
    <p>Booked and settled with <a href="index.html">shoWMe</a>.</p>
  </footer>

  <script type="module" src="/src/profile.ts"></script>
</body>
</html>
