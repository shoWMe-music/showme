<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A waveform mark">
  <defs>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC266"/>
      <stop offset="100%" stop-color="#EE5746"/>
    </linearGradient>
    <radialGradient id="lift" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#F4A046" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#12100E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#12100E"/>
  <rect width="512" height="512" fill="url(#lift)"/>

  <!-- A set that reads as a bar being played: quiet, loud, quiet. -->
  <g fill="url(#bars)">
    <rect x="86"  y="228" width="26" height="56"  rx="13"/>
    <rect x="134" y="196" width="26" height="120" rx="13"/>
    <rect x="182" y="146" width="26" height="220" rx="13"/>
    <rect x="230" y="98"  width="26" height="316" rx="13"/>
    <rect x="278" y="152" width="26" height="208" rx="13"/>
    <rect x="326" y="112" width="26" height="288" rx="13"/>
    <rect x="374" y="190" width="26" height="132" rx="13"/>
    <rect x="422" y="234" width="26" height="44"  rx="13"/>
  </g>
</svg>
