name: Deploy PR Preview
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write

env:
  PROJECT_ID: showme-production
  SERVICE_ACCOUNT: firebase-adminsdk-fbsvc@showme-production.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/639849417444/locations/global/workloadIdentityPools/github-actions/providers/github

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run build:functions
      - run: npm run build:all

      - name: Deploy preview channel
        id: deploy
        run: |
          RESULT=$(npx firebase-tools hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project ${{ env.PROJECT_ID }} --json 2>/dev/null)
          URL=$(echo "$RESULT" | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(Object.values(d.result)[0]?.url || '')")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.deploy.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🔥 Firebase Preview\n\n${process.env.PREVIEW_URL}\n\n_Deploy triggered by commit ${{ github.sha }}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes('Firebase Preview'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
